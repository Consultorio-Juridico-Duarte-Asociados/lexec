name: 🔍 LexEC Verificador y Actualizador

on:
  schedule:
    # Corre una vez al día a las 3am hora Ecuador (8am UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: pip install requests beautifulsoup4 lxml

      - name: 🔍 Ejecutar Verificador
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python robot_verificador.py

      - name: 📊 Resumen
        if: always()
        run: echo "✅ Verificación completada — revisar logs para detalle"
